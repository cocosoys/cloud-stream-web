<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Named here rather than left to the client script: an untitled document
         shows the URL in the tab until the bundle runs. -->
    <title>WebGame</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <!-- The .ico first: it is the file browsers ask for unconditionally and the
         one a desktop shortcut copies, and it carries its own 16/32/48 sizes so
         the tab icon stays sharp at every size. The PNGs stay for the browsers
         that prefer them and for the install prompt. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="180x180" href="icon.png" />
    <!-- The transport is a build-time fact here, not a runtime discovery: the
         server implements WebRTC only and answers 404 on /api/websockets.
         selkies-core resolves the mode as injected value -> last persisted
         value -> WebSockets (selkies-core.js determineStreamingMode), so a
         browser with a clean profile has nothing persisted and falls through to
         WebSockets, then sits in "WebSocket disconnected" against an endpoint
         that does not exist. Publishing the mode here removes that fallback
         for every new device. It has to be an inline script ahead of the
         bundle: main.jsx also probes /api/status for `current_mode`, but that
         endpoint answers plain text `ok`, so the probe never sets anything.
         __SELKIES_DUAL_MODE__ is deliberately left unset -- the server sends no
         enable_dual_mode, which keeps the panel's mode toggle hidden, and
         switching to WebSockets here could only break the session. -->
    <script>window.__SELKIES_STREAMING_MODE__ = "webrtc";</script>
  </head>
  <body>
    <div id="app"></div>
    <div id="root"></div>
    <div id="touch-gamepad-host"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
